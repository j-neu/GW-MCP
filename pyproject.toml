[project]
name = "groundwater-mcp"
version = "0.1.0"
description = "An open-source MCP server for AI-assisted groundwater modelling with MODFLOW 6, FloPy, PEST++, pyEMU, and UCODE."
authors = [
    { name = "j-neu", email = "jakob.fa.neumann@outlook.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "flopy>=3.7",
    "pyemu>=1.3",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "whoosh>=2.7",
    "sentence-transformers>=3.0",
]

[project.scripts]
groundwater-mcp = "groundwater_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
