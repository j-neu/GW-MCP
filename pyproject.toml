[project]
name = "groundwater-mcp"
version = "0.1.0"
description = "An open-source MCP server for AI-assisted groundwater modelling with MODFLOW 6, FloPy, PEST++, and pyEMU."
authors = [
    { name = "j-neu", email = "jakob.fa.neumann@outlook.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "MODFLOW",
    "MODFLOW 6",
    "MCP",
    "model context protocol",
    "groundwater",
    "hydrogeology",
    "calibration",
    "PEST++",
    "FloPy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "mcp>=1.0,<2",
    "flopy>=3.7",
    "pyemu>=1.3",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "whoosh>=2.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/j-neu/GW-MCP"
Issues = "https://github.com/j-neu/GW-MCP/issues"
Changelog = "https://github.com/j-neu/GW-MCP/blob/main/CHANGELOG.md"

[project.scripts]
groundwater-mcp = "groundwater_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures and expected strings are often long literals.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

  [tool.pytest.ini_options]
  testpaths = ["tests"]
  markers = [
      "slow: long-running tests (holdout PEST++ calibration) — run explicitly",
  ]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
