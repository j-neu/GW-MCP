name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src tests examples
      - name: Mypy
        run: uv run mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # uv ignores the matrix unless told which interpreter to use.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install MODFLOW 6 and PEST++ binaries
        run: |
          mkdir -p "$HOME/bin"
          uv run get-modflow "$HOME/bin"
          uv run get-pestpp "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: uv run pytest --cov=groundwater_mcp --cov-report=term-missing
